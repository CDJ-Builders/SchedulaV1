 </header>

 <main class="page-content" id="main-content">
  <div class="page-title">
   <h1 class="page-title-text">Schedule Builder</h1>
   <p>Create a schedule and add events to it.</p>
  </div>

  <section class="page-panel">
   <div class="schedules-header-container dock">
    <h2 class="schedules-title">Schedules</h2>
    <div class="flex-center-gap">
     <select id="schedule-selector" class="schedule-selector" aria-label="Select schedule"><option value="new">+ Create New Schedule</option></select>
     <button id="delete-schedule-btn" class="btn-remove btn-delete-schedule" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>Delete</button>
    </div>
   </div>

   <div class="work">
    <div class="event-form-panel card">
      <h2>Add weekly block</h2>
     <div class="event-form-grid">
       <div class="builder-form-column">
        <label class="field"><span>Title</span><input id="event-title" type="text" required placeholder="Enter a Title"></label>
        <label class="field"><span>Weekday</span><select id="event-weekdays" required>
         <option value="">Select a weekday</option>
         <option value="Monday">Monday</option><option value="Tuesday">Tuesday</option><option value="Wednesday">Wednesday</option>
         <option value="Thursday">Thursday</option><option value="Friday">Friday</option><option value="Saturday">Saturday</option><option value="Sunday">Sunday</option>
        </select></label>
        <label class="field"><span>Modality</span><select id="event-modality" required>
         <option value="">Select a modality</option>
         <option value="onsite">Onsite</option>
         <option value="online">Online</option>
        </select></label>
       </div>
       <div class="builder-form-column">
        <label class="field"><span>Start time</span><input id="event-start" type="time" required></label>
        <label class="field"><span>End time</span><input id="event-end" type="time" required></label>
        <button id="smart-schedule-btn" class="btn-primary btn-save smart-schedule-btn" type="button">
         <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M15 4v16M3 12h18"/></svg>
         Smart Schedule
        </button>
       </div>
       <label class="field description-field"><span>Description</span><textarea id="event-description" rows="5"></textarea></label>
      </div>
     <div class="form-actions">
       <button id="add-event-btn" class="btn-primary" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add block</button>
      <p id="builder-message" class="text-muted-light" role="status"></p>
     </div>
    </div>

    <div class="card">
     <h2>Events</h2>
     <div class="well"><div class="events-list single-column lane" id="scheduledList" aria-busy="true">
      <div class="schedule-skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
     </div></div>
     <div class="save-schedule-container">
      <label class="save-schedule-wrapper" for="schedule-name-input">Schedule title<input type="text" id="schedule-name-input" class="save-input" value="My schedule"></label>
      <button id="save-schedule-btn" class="btn-primary btn-save" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"/></svg>Save</button>
     </div>
    </div>
   </div>
  </section>
