<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedula | Sign Up</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../frontend/css/main.css">
  <link rel="stylesheet" href="../frontend/css/background.css">
  <link rel="stylesheet" href="../frontend/css/chrome.css" data-schedula-header data-site-footer>
  <link rel="stylesheet" href="../frontend/css/auth.css">
  <link rel="stylesheet" href="../frontend/css/popup.css" data-schedula-popup>
  <script src="../frontend/scripts/theme.js"></script>
</head>

<body class="schedula-background auth-page has-site-footer">
  <header class="auth-header app-shell-header">
    <a class="auth-brand brand" href="../index.html" aria-label="Schedula home">
      <img src="../assets/logo.png" alt="" class="auth-logo">
      <span class="auth-brand-text">Schedula</span>
    </a>
    <nav class="auth-nav header-tools" aria-label="Account navigation">
      <button class="theme-toggle auth-theme-btn" type="button" aria-label="Toggle theme"></button>
      <button class="auth-back-btn" id="close-signup-btn" type="button" aria-label="Back to home"
        onclick="window.location.href='../index.html'">Back</button>
    </nav>
  </header>

  <main class="page-shell">
    <section class="login-card" aria-labelledby="signup-title">
      <div class="auth-visual">
        <div>
          <h1 id="signup-title"><span>Create</span><span>your week</span></h1>
          <p class="auth-visual-copy">Add classes, visualize plans, and keep overlapping commitments in view.</p>
        </div>
      </div>

      <div class="card-content">
        <h1>Sign up</h1>
        <p class="subtitle" id="signup-subtitle">Create your Schedula account</p>
        <div class="form-group">
          <label class="field">
            <span>Email</span>
            <input id="signup-email" type="email" name="email" placeholder="you@example.com" aria-label="Email address" autocomplete="email" required>
          </label>

          <div class="field" id="signup-password-group">
            <div class="password-field-heading">
              <label for="signup-password">Password</label>
              <span class="password-requirements">
                <button class="password-requirements-trigger" type="button" aria-label="Show password requirements" aria-describedby="password-requirements-tooltip">?</button>
                <span class="password-requirements-tooltip" id="password-requirements-tooltip" role="tooltip">
                  <strong>Password must include:</strong>
                  <ul>
                    <li>At least 6 characters</li>
                    <li>One number</li>
                    <li>One uppercase letter</li>
                    <li>One lowercase letter</li>
                  </ul>
                </span>
              </span>
            </div>
            <input id="signup-password" type="password" name="password" placeholder="Create password" aria-label="Password" aria-describedby="password-requirements-tooltip" autocomplete="new-password" required>
          </div>

          <label class="field" id="signup-confirm-password-group">
            <span>Confirm password</span>
            <input id="signup-confirm-password" type="password" name="confirmPassword" placeholder="Repeat your password" aria-label="Confirm password" autocomplete="new-password" required>
          </label>
        </div>

        <label class="field" id="signup-pin-group" style="display:none">
          <span>Email verification PIN</span>
          <input id="signup-pin" type="text" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
        </label>

        <div class="separator"></div>
        <button class="button primary signup-btn" type="button">Create Account</button>

        <div class="separator"></div>

        <div class="footer-links">
          <p>Already have an account? <button class="link-button accent" id="login" type="button">Log in</button></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer site-footer--static" role="contentinfo" aria-busy="true"></footer>
  <script src="../frontend/scripts/utils.js"></script>
  <script src="../frontend/scripts/popup.js"></script>
  <script src="../frontend/scripts/background.js"></script>
  <script src="../frontend/scripts/header.js"></script>
  <script src="../frontend/scripts/footer.js"></script>
  <script src="../frontend/scripts/auth.js"></script>
</body>
</html>
