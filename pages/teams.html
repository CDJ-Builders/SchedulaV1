<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedula | Teams</title>
<meta name="description" content="Compare your team's schedules and find a time that works for everyone.">
<link rel="icon" type="image/png" href="../favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet">
<style>

:root{--lav:#b596c8;--plum:#2a1245;--purple:#62298a;--flag:#c2255c;--row:56px;--rows:7;color-scheme:light;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
body{min-height:100svh;background:#fff;color:var(--plum);font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;font-optical-sizing:auto;font-size:18px;line-height:1.5}
.page{width:100%;max-width:1280px;margin:0 auto;padding:28px 32px 56px;min-height:100svh;display:grid;grid-template-rows:auto 1fr;gap:24px}
:focus-visible{outline:3px solid var(--plum);outline-offset:4px}

/* Header: brand, navigation keys, account */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 24px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:26px;letter-spacing:-.02em;color:inherit;text-decoration:none}
.mark{width:48px;height:48px}
.tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:14px 16px}
.nav{display:flex;flex-wrap:wrap;gap:12px}
.acct{display:flex;align-items:center;gap:8px;height:42px;padding:0 16px 0 6px;border-radius:999px;border:2px solid var(--plum);background:#fff;font-size:14px;font-weight:700;line-height:1}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;border:1px solid rgba(42,18,69,.6);
 background:linear-gradient(180deg,#d9c2ec 0%,#a27cb7 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.acct-name{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}


/* Skeuomorphic keys: raised faces with a visible side that press down */
.key{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
 font:700 17px/1 "Bricolage Grotesque",system-ui,sans-serif;padding:16px 30px 17px;border-radius:14px;border:1px solid rgba(42,18,69,.6);cursor:pointer;color:var(--plum);
 text-shadow:0 1px 0 rgba(255,255,255,.7);transition:transform .08s,box-shadow .08s;
 background:linear-gradient(180deg,#fff 0%,#f2e8fa 48%,#e0cfee 100%);
 box-shadow:inset 0 1px 0 #fff,inset 0 -3px 0 rgba(98,41,138,.18),0 5px 0 var(--purple),0 10px 14px rgba(42,18,69,.34)}
.key.lav{background:linear-gradient(180deg,#d9c2ec 0%,#bb99d2 50%,#a27cb7 100%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(42,18,69,.2),0 5px 0 #4a1d6d,0 10px 14px rgba(42,18,69,.34)}
.key:hover{transform:translateY(-1px)}
.key:active{transform:translateY(4px);box-shadow:inset 0 2px 5px rgba(42,18,69,.35),0 1px 0 var(--purple),0 2px 4px rgba(42,18,69,.3)}
.key.lav:active{box-shadow:inset 0 2px 5px rgba(42,18,69,.35),0 1px 0 #4a1d6d,0 2px 4px rgba(42,18,69,.3)}
.key.sm{padding:12px 20px 13px;font-size:15px;border-radius:12px}
.key.icon{width:42px;height:42px;padding:0}
.key.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* The page you are on stays pressed down */
.key[aria-current="page"]{cursor:default;transform:translateY(4px);
 background:linear-gradient(180deg,#d9c2ec 0%,#bb99d2 50%,#a27cb7 100%);
 box-shadow:inset 0 2px 5px rgba(42,18,69,.35),0 1px 0 #4a1d6d,0 2px 4px rgba(42,18,69,.3)}
.key[aria-current="page"]:hover{transform:translateY(4px)}


.key[aria-pressed="true"]{cursor:default;transform:translateY(4px);background:linear-gradient(180deg,#d9c2ec 0%,#bb99d2 50%,#a27cb7 100%);box-shadow:inset 0 2px 5px rgba(42,18,69,.35),0 1px 0 #4a1d6d,0 2px 4px rgba(42,18,69,.3)}
.key:disabled{cursor:not-allowed;opacity:.55;transform:translateY(3px);box-shadow:inset 0 2px 4px rgba(42,18,69,.25),0 2px 0 rgba(98,41,138,.7)}
.key.xs{padding:8px 12px 9px;font-size:13px;border-radius:10px;box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(98,41,138,.18),0 3px 0 var(--purple),0 6px 10px rgba(42,18,69,.3)}

/* Layout */
.wrap{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:48px;align-items:start}
h1{font-weight:800;font-variation-settings:"wdth" 80;font-size:clamp(2.8rem,4.8vw,4.8rem);line-height:.92;letter-spacing:-.035em}
h1 span{display:block}
.lede{margin:18px 0 26px;max-width:30ch;font-size:1.15rem;line-height:1.4;font-weight:500}
.lbl{display:block;font-size:.76rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin:0 0 7px}
select,input{width:100%;padding:13px 14px;border:1px solid rgba(42,18,69,.35);border-radius:14px;background:#fff;color:var(--plum);font:500 1rem/1.3 "Bricolage Grotesque",system-ui,sans-serif;box-shadow:inset 0 2px 4px rgba(42,18,69,.14)}
.cta{display:flex;flex-wrap:wrap;gap:16px;margin:18px 0 30px}

/* Raised panel */
.panel{padding:20px 22px 22px;border-radius:24px;background:#fff;border:2px solid #fff;box-shadow:inset 0 1px 0 #fff,inset 0 -3px 0 rgba(98,41,138,.14),0 0 0 1px rgba(42,18,69,.1),0 6px 0 var(--purple),0 14px 20px rgba(42,18,69,.26)}
.panel h2{font-size:1.2rem;font-weight:800;font-variation-settings:"wdth" 85;margin-bottom:12px}
.mem{list-style:none;padding:0;display:grid;gap:10px}
.mem li{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.mem .avatar{flex:none}.mem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1.5px solid var(--plum);background:#fff}
.role.admin{background:#d9c2ec}
.invite{margin-top:16px;padding:14px;border-radius:16px;background:#e6d6f1;border:2px solid var(--plum);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.invite code{font-weight:800;font-size:16px;letter-spacing:.06em}

/* Board: one lane per member */
.days{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.board{padding:12px;border-radius:24px;background:#fff;border:2px solid #fff;box-shadow:inset 0 1px 0 #fff,inset 0 -3px 0 rgba(98,41,138,.14),0 0 0 1px rgba(42,18,69,.1),0 6px 0 var(--purple),0 14px 20px rgba(42,18,69,.26)}
.cols,.wells{display:grid}
.cols h3{font-size:.95rem;font-weight:700;padding:2px 6px 10px;text-align:center;text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wells{position:relative}
.well{height:calc(var(--row)*12);background:#b596c8;border:1px solid #fff;border-left-width:0}
.well:first-child{border-radius:16px 0 0 16px;border-left-width:1px}
.well:last-child{border-radius:0 16px 16px 0}
.well:not(:first-child){border-left:2px solid #fff}
.lane{position:relative;height:100%;border-radius:inherit;background-color:rgba(255,255,255,.32);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
 box-shadow:inset 0 3px 7px rgba(42,18,69,.28),inset 0 0 0 1px rgba(255,255,255,.55);
 background-image:repeating-linear-gradient(to bottom,rgba(98,41,138,.22) 0 1px,transparent 1px var(--row)),repeating-linear-gradient(to bottom,rgba(98,41,138,.08) 0 1px,transparent 1px calc(var(--row)/2))}
/* free-for-everyone band across all lanes */
.free{position:absolute;left:0;right:0;z-index:2;pointer-events:none;border:2.5px solid var(--plum);border-radius:12px;background:rgba(255,255,255,.18)}
.free span{position:absolute;left:10px;top:-2px;transform:translateY(-50%);padding:3px 12px;border-radius:999px;background:var(--plum);color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap}
/* glass blocks */
.blk{position:absolute;left:6px;right:6px;margin-top:2px;padding:6px 10px;border-radius:12px;overflow:hidden;z-index:1;font-size:13px;line-height:1.25;
 background:rgba(255,255,255,.42);-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);
 border:1px solid rgba(255,255,255,.85);box-shadow:0 10px 24px rgba(42,18,69,.26),inset 0 1px 0 rgba(255,255,255,.95);
 animation:drop .5s cubic-bezier(.2,.9,.3,1.15) backwards;animation-delay:calc(var(--i)*50ms)}
.blk b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk small{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.team{border-color:var(--plum);border-width:1.5px}
.blk.prop{border:2px dashed var(--plum);background:rgba(255,255,255,.62)}

.dock{margin-top:26px;padding:16px 18px 20px;border-radius:18px;background:#e6d6f1;border:2px solid var(--plum);display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between}
.dock p{flex:1 1 260px;max-width:50ch;font-size:16px;line-height:1.35}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.chip{padding:6px 14px;border-radius:999px;font-size:14px;font-weight:700;border:2px solid var(--plum);background:#fff}
dialog{margin:auto;width:min(420px,calc(100vw - 32px));padding:26px;border-radius:24px;border:2px solid var(--plum);background:#fff;color:var(--plum);box-shadow:0 6px 0 var(--purple),0 20px 40px rgba(42,18,69,.35)}
dialog::backdrop{background:rgba(42,18,69,.45)}
dialog h2{font-size:1.4rem;margin-bottom:14px}.dm{min-height:20px;font-size:14px;margin:10px 0 14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes drop{from{opacity:0;transform:translateY(-18px)}}
@media (max-width:1080px){.wrap{grid-template-columns:1fr;gap:36px}.lede{max-width:36ch}}
@media (max-width:720px){:root{--row:34px}.page{padding:20px 18px 40px}.tools{justify-content:flex-start}.blk small{display:none}.cols h3{font-size:.8rem;letter-spacing:.04em}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
 // Add ?mock=1 to preview without signing in, or &no-team=1 to preview team onboarding.
 if (!localStorage.getItem('token') && !/[?&]mock=1/.test(location.search)) { location.href = 'login.html'; return; }

 var nameEl = document.getElementById('header-username-display'), av = document.getElementById('avatar');
 function sync() { var n = (nameEl.textContent.trim()) || 'User'; av.textContent = n.charAt(0).toUpperCase(); }
 sync(); new MutationObserver(sync).observe(nameEl, { childList: true, characterData: true, subtree: true });

 /* ── Data layer ────────────────────────────────────────────────────
    Everything below reads from TEAMS. Replace loadTeams() with calls to the
    backend and map its fields into this shape; the UI only uses these keys:
    team {id,name,role,code,members[],events{day:[[start,end,title]]}}
    member {name,role,busy{day:[[start,end,title?]]}}  (hours, 24h, halves allowed) */
 var DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
 function loadTeams() {
  if (new URLSearchParams(location.search).get('no-team') === '1') return [];
  return [
  { id:'t1', name:'BSCS 3A · Capstone', role:'admin', code:'SCH-4F7Q', events:{ Tue:[[15,16,'Capstone Sync']] }, members:[
   { name:'You', role:'admin', busy:{ Mon:[[8,9.5,'CS 301'],[13,14.5,'CS 315']], Tue:[[9,10.5,'IT 220'],[14,15,'Study group']], Wed:[[8,9.5,'CS 301'],[11,12.5,'Math 210']], Thu:[[10,11.5,'CS 315']], Fri:[[8,9.5,'CS 301']] } },
   { name:'Mika', role:'admin', busy:{ Mon:[[9,11]], Tue:[[10,12]], Wed:[[8,10],[14,16]], Thu:[[8,9.5],[13,15]], Fri:[[10,12]] } },
   { name:'Jun', role:'member', busy:{ Mon:[[8,10],[15,17]], Tue:[[8,9.5],[13,14.5]], Wed:[[9,11],[16,17]], Thu:[[11,13]], Fri:[[9,10.5],[14,16]] } },
   { name:'Ana', role:'member', busy:{ Mon:[[10,12],[14,15.5]], Tue:[[11,13]], Wed:[[10,11.5],[13,14.5]], Thu:[[9,10.5],[15,17]], Fri:[[8,9.5],[13,14]] } } ] },
  { id:'t2', name:'Org Officers', role:'member', code:'', events:{}, members:[
   { name:'You', role:'member', busy:{ Mon:[[8,9.5,'CS 301']], Tue:[[9,10.5,'IT 220']], Wed:[[11,12.5,'Math 210']] } },
   { name:'Paolo', role:'admin', busy:{ Mon:[[10,12]], Tue:[[8,10]], Wed:[[9,11]] } },
   { name:'Kaye', role:'member', busy:{ Mon:[[13,15]], Tue:[[12,14]], Wed:[[14,16]] } } ] } ];
 }

 var TEAMS = loadTeams(), team = TEAMS[0] || null, day = 'Mon', props = {}, viewMode = 'team', selectedMember = 'You', ROW = 40, H0 = 7, H1 = 19, FROM = 8, TO = 18;
 TEAMS.forEach(function (item) {
  var overrides = window.TEAM_OVERRIDES.get(item.id);
  if (typeof overrides.name === 'string') item.name = overrides.name;
  if (Array.isArray(overrides.admins)) {
   item.members.forEach(function (member) {
    member.role = overrides.admins.indexOf(member.name) !== -1 ? 'admin' : 'member';
   });
   var currentMember = item.members.filter(function (member) { return member.name === 'You'; })[0];
   item.role = currentMember ? currentMember.role : 'member';
  }
 });
 var $ = function (id) { return document.getElementById(id); };
 function t(h) { var H = Math.floor(h), p = H >= 12 ? 'PM' : 'AM'; return (H % 12 || 12) + ':' + (h % 1 ? '30' : '00') + ' ' + p; }
 function rng(a, b) { return t(a) + ' – ' + t(b); }
 function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

 function busyOf(m) { // personal busy + team events + proposals, for the chosen day
  var k = team.id + day, list = (m.busy[day] || []).map(function (b) { return { s:b[0], e:b[1], title:b[2] || 'Busy', kind:'' }; });
  (team.events[day] || []).forEach(function (b) { list.push({ s:b[0], e:b[1], title:b[2], kind:'team' }); });
  (props[k] || []).forEach(function (b) { list.push({ s:b[0], e:b[1], title:'Team meeting', kind:'prop' }); });
  return list;
 }
 function windows() { // times when every member is free, at least 1 hour
  var out = [], s = null;
  for (var h = FROM; h < TO; h += .5) {
   var free = team.members.every(function (m) { return !busyOf(m).some(function (b) { return h < b.e && b.s < h + .5; }); });
   if (free && s === null) s = h;
   if (!free && s !== null) { out.push([s, h]); s = null; }
  }
  if (s !== null) out.push([s, TO]);
  return out.filter(function (w) { return w[1] - w[0] >= 1; });
 }

 function revealMember(button) {
  if (!button || memberSlider.hidden) return;
  var sliderRect = memberSlider.getBoundingClientRect();
  var buttonRect = button.getBoundingClientRect();
  var visibleLeft = sliderRect.left + memberSlider.clientLeft;
  var visibleRight = visibleLeft + memberSlider.clientWidth;
  if (buttonRect.left < visibleLeft) {
   memberSlider.scrollBy({ left: buttonRect.left - visibleLeft, behavior:'smooth' });
  } else if (buttonRect.right > visibleRight) {
   memberSlider.scrollBy({ left: buttonRect.right - visibleRight, behavior:'smooth' });
  }
 }

 function render() {
  var ws = windows(), best = ws.slice().sort(function (a, b) { return (b[1] - b[0]) - (a[1] - a[0]) || a[0] - b[0]; })[0];
  var bd = $('board'); bd.textContent = '';
  bd.classList.toggle('team-view-mode', viewMode === 'team');
  $('view-toggle').textContent = viewMode === 'team' ? 'Team View' : 'Member View';
  $('view-toggle').setAttribute('aria-pressed', viewMode === 'member' ? 'true' : 'false');
  $('view-toggle').setAttribute('aria-label', 'Switch to ' + (viewMode === 'team' ? 'member' : 'team') + ' view');
  memberSlider.hidden = viewMode !== 'member';
  if (viewMode === 'member') revealMember(memberSlider.querySelector('[aria-pressed="true"]'));

  if (viewMode === 'team') {
   bd.setAttribute('aria-label', 'Team schedules for ' + team.members.map(function (m) { return m.name; }).join(', '));
   var table = el('div', 'team-table');
   var header = el('div', 'team-table-header');
   header.appendChild(el('div', 'member-heading', 'Member'));
   ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].forEach(function (label) {
    header.appendChild(el('div', '', label));
   });
   table.appendChild(header);

   team.members.forEach(function (m) {
    var row = el('div', 'team-table-row');
    var memberCell = el('div', 'team-member-cell');
    memberCell.appendChild(el('span', 'team-member-name', m.name));
    memberCell.appendChild(el('span', 'team-member-role', m.name === 'You' ? 'View schedule' : 'View week'));
    row.appendChild(memberCell);

    DAYS.forEach(function (shortDay) {
     var fullDay = {Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'}[shortDay];
     var cell = el('div', 'team-day-cell');
     var blocks = (m.busy[shortDay] || []).map(function (b) { return { s:b[0], e:b[1], title:b[2] || 'Busy', kind:'' }; });
     (team.events[shortDay] || []).forEach(function (b) { blocks.push({ s:b[0], e:b[1], title:b[2], kind:'team' }); });
     if (!blocks.length) cell.appendChild(el('span', 'team-empty', 'No blocks added'));
     blocks.forEach(function (b) {
      var block = el('div', 'team-block ' + b.kind);
      block.appendChild(el('b', '', b.title));
      block.appendChild(el('small', '', rng(b.s, b.e)));
      cell.appendChild(block);
     });
     cell.setAttribute('aria-label', fullDay);
     row.appendChild(cell);
    });
    table.appendChild(row);
   });
   bd.appendChild(table);
  } else {
   var member = team.members.filter(function (m) { return m.name === selectedMember; })[0] || team.members[0];
   if (member) {
    selectedMember = member.name;
    bd.setAttribute('aria-label', member.name + "'s weekly schedule");
    var week = el('div', 'member-week');
    var weekHeader = el('div', 'member-week-header');
    weekHeader.appendChild(el('div', 'member-timezone', 'GMT+8'));
    ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].forEach(function (label) {
     weekHeader.appendChild(el('div', '', label));
    });
    week.appendChild(weekHeader);
    var weekBody = el('div', 'member-week-body');
    var timeAxis = el('div', 'member-time-axis');
    for (var hour = FROM; hour < TO; hour++) {
     var label = hour < 12 ? hour + ' AM' : (hour === 12 ? '12 PM' : hour - 12 + ' PM');
     timeAxis.appendChild(el('span', '', label));
    }
    weekBody.appendChild(timeAxis);
    DAYS.forEach(function (shortDay) {
     var column = el('div', 'member-day-column');
     column.setAttribute('aria-label', shortDay);
     var blocks = (member.busy[shortDay] || []).map(function (b) { return { s:b[0], e:b[1], title:b[2] || 'Busy', kind:'' }; });
     (team.events[shortDay] || []).forEach(function (b) { blocks.push({ s:b[0], e:b[1], title:b[2], kind:'team' }); });
     (props[team.id + shortDay] || []).forEach(function (b) { blocks.push({ s:b[0], e:b[1], title:'Team meeting', kind:'prop' }); });
     blocks.forEach(function (b) {
      if (b.e <= FROM || b.s >= TO) return;
      var block = el('div', 'team-block member-week-block ' + b.kind);
      block.style.top = ((Math.max(b.s, FROM) - FROM) / (TO - FROM) * 100) + '%';
      block.style.height = ((Math.min(b.e, TO) - Math.max(b.s, FROM)) / (TO - FROM) * 100) + '%';
      block.appendChild(el('b', '', b.title));
      block.appendChild(el('small', '', rng(b.s, b.e)));
      column.appendChild(block);
     });
     weekBody.appendChild(column);
    });
    week.appendChild(weekBody);
    bd.appendChild(week);
   }
  }

  var msg = best ? 'Everyone is free on ' + day + ': ' + rng(best[0], best[1]) + '.' : 'No time works for everyone on ' + day + '. Try another day.';
  if ($('msg').textContent !== msg) { $('msg').textContent = msg; $('live').textContent = msg; }
  $('chip').textContent = ws.length + (ws.length === 1 ? ' free window' : ' free windows');
  $('prop').disabled = !best;
  $('prop').onclick = function () { var k = team.id + day, text = 'Team meeting proposed for ' + day + ', ' + rng(best[0], best[0] + 1) + '. Members will be asked to confirm.'; (props[k] = props[k] || []).push([best[0], best[0] + 1]); render(); $('msg').textContent = text; $('live').textContent = text; };
 }

 var sel = $('team');
 function fill() { sel.textContent = ''; TEAMS.forEach(function (x) { var o = el('option', '', x.name + (x.role === 'admin' ? ' (admin)' : '')); o.value = x.id; sel.appendChild(o); }); sel.value = team.id; }
 function updateSettingsLink() { $('team-settings-link').href = 'teams-settings.html?team=' + encodeURIComponent(team.id); }
 sel.onchange = function () { team = TEAMS.filter(function (x) { return x.id === sel.value; })[0]; fillMembers(); updateSettingsLink(); render(); };

 var memberSlider = $('member-slider');
 function fillMembers() {
  memberSlider.textContent = '';
  if (!team.members.some(function (m) { return m.name === selectedMember; })) selectedMember = team.members[0] ? team.members[0].name : '';
  team.members.forEach(function (m) {
   var button = el('button', 'member-slide', m.name);
   button.type = 'button';
   button.setAttribute('aria-pressed', m.name === selectedMember ? 'true' : 'false');
   button.onclick = function () {
    selectedMember = m.name;
    memberSlider.querySelectorAll('.member-slide').forEach(function (memberButton) {
     memberButton.setAttribute('aria-pressed', memberButton === button ? 'true' : 'false');
    });
    render();
   };
   memberSlider.appendChild(button);
  });
 }
 $('view-toggle').onclick = function () { viewMode = viewMode === 'team' ? 'member' : 'team'; render(); };
 $('show-member-preferences').onclick = function () { window.showTeamPreferences(team.name, team.members); };

 // create / join dialog (demo only: wire to the backend)
 var dlg = $('dlg'), noTeamDialog = $('no-team-dialog'), mode = 'create';
 function openTeamForm(nextMode) {
  mode = nextMode;
  $('dt').textContent = mode === 'create' ? 'Create a team' : 'Join with a code';
  $('dl').textContent = mode === 'create' ? 'Team name' : 'Invite code';
  $('dv').value = '';
  $('dm').textContent = '';
  noTeamDialog.close();
  dlg.showModal();
  $('dv').focus();
 }
 document.querySelectorAll('[data-dlg]').forEach(function (b) { b.onclick = function () { openTeamForm(b.dataset.dlg); }; });
 $('create-team-from-empty').onclick = function () { openTeamForm('create'); };
 $('join-team-from-empty').onclick = function () { openTeamForm('join'); };
 function closeNoTeamDialog() {
  noTeamDialog.close();
  document.body.classList.remove('no-team-mode');
 }
 $('close-no-team').onclick = closeNoTeamDialog;
 noTeamDialog.addEventListener('cancel', function (event) {
  event.preventDefault();
  closeNoTeamDialog();
 });
 dlg.addEventListener('cancel', function (event) {
  if (!TEAMS.length) {
   event.preventDefault();
   dlg.close();
   noTeamDialog.showModal();
  }
 });
 $('dno').onclick = function () {
  dlg.close();
  if (!TEAMS.length) noTeamDialog.showModal();
 };
 $('dok').onclick = function () {
  var v = $('dv').value.trim(); if (!v) { $('dm').textContent = mode === 'create' ? 'Enter a team name.' : 'Enter the invite code.'; return; }
  if (mode === 'create') { var nt = { id:'t' + (TEAMS.length + 1), name:v, role:'admin', code:'SCH-' + Math.random().toString(36).slice(2, 6).toUpperCase(), events:{}, members:[{ name:'You', role:'admin', busy:{} }] }; TEAMS.push(nt); team = nt; document.body.classList.remove('no-team-mode'); $('main-content').hidden = false; fill(); fillMembers(); updateSettingsLink(); render(); dlg.close(); noTeamDialog.close(); }
  else $('dm').textContent = 'Joining needs the backend, which is not connected in this preview.';
 };

 if (TEAMS.length) {
  fill(); fillMembers(); updateSettingsLink(); render();
 } else {
  document.body.classList.add('no-team-mode');
  noTeamDialog.showModal();
 }
});
</script>
