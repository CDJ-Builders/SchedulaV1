  </nav>
  <div class="tools">
   <div class="acct" role="group" aria-label="Signed-in account"><span class="avatar" id="avatar" aria-hidden="true">U</span><span class="acct-name" id="header-username-display">User</span></div>
   <button class="theme-toggle key sm icon" type="button" aria-label="Toggle theme"></button>

  </div>
 </header>

 <main class="wrap" id="main-content">
  <p class="team-status" id="team-status" role="status" aria-live="polite">Loading teams…</p>
  <section class="teams-toolbar" aria-label="Team schedule controls">
   <div class="team-view-control">
    <button class="team-view-title" type="button" id="view-toggle" aria-pressed="false">Team View</button>
    <div id="member-slider" class="member-slider" role="group" aria-label="Select team member" hidden></div>
   </div>
   <div class="team-name-control">
    <label class="sr" for="team">Team</label>
    <select id="team" class="team-select"></select>
    <button class="preferences-button" type="button" id="show-member-preferences">Preferences</button>
    <a class="team-settings" id="team-settings-link" href="teams-settings.html?team=t1" aria-label="Team settings" title="Team settings">
     <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-2.6V20a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L7.6 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 6.4 14H6v-2.6h.4a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1L9.4 6.6l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V5.2H15v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1H21V14h-.2a1.7 1.7 0 0 0-1.4 1z"/></svg>
    </a>
   </div>
  </section>

  <section class="team-content" aria-label="Team availability">
   <div class="board" role="table" id="board"></div>
   <div class="dock">
    <label class="team-day-control" for="team-day">
     <span>Meeting day</span>
     <select id="team-day">
      <option value="Mon">Monday</option><option value="Tue">Tuesday</option><option value="Wed">Wednesday</option>
      <option value="Thu">Thursday</option><option value="Fri">Friday</option><option value="Sat">Saturday</option><option value="Sun">Sunday</option>
     </select>
    </label>
    <label class="team-day-control" for="team-modality">
     <span>Modality</span>
     <select id="team-modality"><option value="online">Online</option><option value="onsite">Onsite</option></select>
    </label>
    <span class="free-count" id="chip">2 free windows</span>
    <button class="propose-button" type="button" id="prop">Propose</button>
   </div>
   <section class="team-proposals" id="team-proposals" aria-labelledby="team-proposals-heading" hidden>
    <h2 id="team-proposals-heading">Meeting proposals</h2>
    <div id="team-proposals-list"></div>
   </section>
   <p class="sr" id="msg"></p>
   <p class="sr" id="live" aria-live="polite"></p>
  </section>
 </main>

 <div class="preferences-dialog-heading">
  <div>
   <h2 id="member-preferences-title">Member preferences</h2>
   <p id="member-preferences-caption">Sample preferences</p>
  </div>

</dialog>

<dialog class="no-team-dialog" id="no-team-dialog" aria-labelledby="no-team-title">
 <div class="no-team-heading">
  <h1 id="no-team-title">No Team Yet</h1>
  <button class="no-team-close" type="button" id="close-no-team" aria-label="Close No Team Yet popup">×</button>
 </div>
 <div class="no-team-actions">
  <button class="no-team-action" type="button" id="join-team-from-empty">
   <span>Join Team</span>
   <span class="no-team-action-detail">Enter Code</span>
  </button>
  <button class="no-team-action" type="button" id="create-team-from-empty">Create Team</button>
 </div>
</dialog>

 <div class="cta" style="margin:0"><button class="key sm" type="button" id="dok">Continue</button><button class="key sm lav" type="button" id="dno">Cancel</button></div></dialog>
