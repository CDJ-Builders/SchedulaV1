 <main class="hero" id="top">
  <div>
   <h1><span>Build your</span><span>daily blocks</span></h1>
   <p class="lede">Add your classes and meetings, see clashes the moment they happen, and share the plan with your team.</p>
   <div class="cta"><button class="key" type="button">Create account</button><button class="key lav" type="button">Log in</button></div>
  </div>
  <section aria-label="Try moving blocks on two sample days">
   <div class="days" id="days"></div>
   <div class="dock">
    <p id="msg"></p>
    <div class="acts">
     <button class="key sm" type="button" id="mv">Move</button>
     <button class="key sm lav" type="button" id="rs">Reset</button>
     <span class="chip" id="chip" data-s="ok">No overlaps</span>
    </div>
   </div>
   <p class="sr" id="live" aria-live="polite"></p>
  </section>
 </main>

<script>
(function(){
 var START=420,END=1020,STEP=30;
 var days=[
  {n:'Day 1',b:[
   {t:'CS 301 · Machine Learning',s:'Prof. Reyes · Room 204',st:480,d:90},
   {t:'CS 315 · Software Engineering',s:'Prof. Santos · Room 118',st:600,d:90},
   {t:'Capstone Team Sync',s:'BSCS 3A · Google Meet',st:660,d:60},
   {t:'Study group · Data Structures',s:'Library · Room 3',st:840,d:90}]},
  {n:'Day 2',b:[
   {t:'IT 220 · Database Systems',s:'Prof. Cruz · Room 305',st:540,d:90},
   {t:'Math 210 · Discrete Structures',s:'Prof. Lim · Room 112',st:660,d:90},
   {t:'Org Officers Meeting',s:'Student Council · Room 2',st:810,d:60},
   {t:'CS 340 · Network Security Lab',s:'Prof. Tan · Lab 4',st:900,d:120}]}
 ];
 var all=[],wrap=document.getElementById('days');
 var chip=document.getElementById('chip'),msg=document.getElementById('msg'),mv=document.getElementById('mv'),rs=document.getElementById('rs'),live=document.getElementById('live');
 function parts(m){var h=Math.floor(m/60),mm=m%60;return[(h%12||12)+':'+(mm<10?'0':'')+mm,m>=720?'PM':'AM']}
 function fmt(m){var p=parts(m);return p[0]+' '+p[1]}
 function range(a,b){var x=parts(a),y=parts(b);return x[0]+(x[1]===y[1]?'':' '+x[1])+' – '+y[0]+' '+y[1]}
 days.forEach(function(d,di){
  var col=document.createElement('div');col.className='day';
  col.innerHTML='<h2></h2><div class="well"><div class="lane"></div></div>';col.firstChild.textContent=d.n;
  var lane=col.querySelector('.lane');wrap.appendChild(col);
  d.b.forEach(function(b){
   b.day=di;b.home=b.st;b.i=all.length;
   var el=document.createElement('div');el.className='block'+(b.d>=90?' tall':'');el.tabIndex=0;el.setAttribute('role','button');el.style.setProperty('--i',b.i);
   el.innerHTML='<span class="grip" aria-hidden="true"></span><b></b><span class="tm"></span><span class="sb"></span>';
   el.querySelector('b').textContent=b.t;el.querySelector('.sb').textContent=b.s;
   var tm=el.querySelector('.tm'),fl=document.createElement('em');fl.className='flag';fl.textContent=' · Overlaps';
   tm.appendChild(document.createTextNode(''));tm.appendChild(fl);
   b.el=el;lane.appendChild(el);all.push(b);
  });
 });
 var last=null,target=null,slot=null;
 function place(b){
  var e=b.el,r=range(b.st,b.st+b.d);
  e.style.top='calc(var(--row)*'+((b.st-START)/60)+')';e.style.height='calc(var(--row)*'+(b.d/60)+' - 4px)';
  e.querySelector('.tm').firstChild.nodeValue=r;
  e.setAttribute('aria-label',days[b.day].n+', '+b.t+', '+r+'. Use the up and down arrow keys to move it.');
 }
 function pairs(){var o=[];all.forEach(function(a){all.forEach(function(b){if(a.i<b.i&&a.day===b.day){var m=Math.min(a.st+a.d,b.st+b.d)-Math.max(a.st,b.st);if(m>0)o.push({a:a,b:b,m:m})}})});return o}
 function freeSlot(b){var best=null;for(var s=START;s+b.d<=END;s+=STEP){
  if(all.some(function(o){return o!==b&&o.day===b.day&&s<o.st+o.d&&o.st<s+b.d}))continue;
  var dist=Math.abs(s-b.st);if(!best||dist<best.dist)best={s:s,dist:dist}}return best}
 function render(){
  var ps=pairs();all.forEach(function(b){b.el.classList.remove('clash')});
  ps.forEach(function(p){p.a.el.classList.add('clash');p.b.el.classList.add('clash')});
  chip.dataset.s=ps.length?'clash':'ok';chip.textContent=ps.length?ps.length+(ps.length>1?' overlaps':' overlap'):'No overlaps';
  var text;target=null;slot=null;
  if(ps.length){
   var p=ps[0];target=(p.a===last)?p.a:(p.b===last)?p.b:(p.a.st>p.b.st?p.a:p.b);
   slot=freeSlot(target);
   text='Overlap detected on '+days[target.day].n+', '+(slot?fmt(slot.s)+' is the optimal time.':'no free time is left for it.');
  }else{text='No overlaps. Drag a block onto another to see what happens.'}
  mv.disabled=!slot;mv.setAttribute('aria-label',slot?'Move '+target.t+' to '+fmt(slot.s):'Move, unavailable');
  rs.disabled=!all.some(function(b){return b.st!==b.home});
  if(msg.textContent!==text){msg.textContent=text;live.textContent=text}
 }
 mv.addEventListener('click',function(){if(slot){target.st=slot.s;place(target);render()}});
 rs.addEventListener('click',function(){all.forEach(function(b){b.st=b.home;place(b)});last=null;render()});
 function find(el){for(var i=0;i<all.length;i++)if(all[i].el===el)return all[i]}
 wrap.addEventListener('pointerdown',function(e){
  var el=e.target.closest('.block');if(!el||e.button>0)return;
  if(e.pointerType==='touch'&&!e.target.closest('.grip'))return;
  var b=find(el),rowPx=el.parentNode.clientHeight/10,y0=e.clientY,s0=b.st;last=b;
  el.setPointerCapture(e.pointerId);el.classList.add('drag');el.focus({preventScroll:true});e.preventDefault();
  function mvf(ev){var m=Math.round((s0+(ev.clientY-y0)/rowPx*60)/STEP)*STEP;m=Math.max(START,Math.min(END-b.d,m));if(m!==b.st){b.st=m;place(b);render()}}
  function up(){el.classList.remove('drag');el.removeEventListener('pointermove',mvf);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up)}
  el.addEventListener('pointermove',mvf);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
 });
 wrap.addEventListener('keydown',function(e){
  var el=e.target.closest('.block');if(!el||(e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;
  e.preventDefault();var b=find(el);last=b;
  var m=b.st+(e.key==='ArrowUp'?-STEP:STEP);m=Math.max(START,Math.min(END-b.d,m));if(m!==b.st){b.st=m;place(b);render()}
 });
 all.forEach(place);render();
})();
</script>
